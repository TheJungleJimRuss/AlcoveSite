<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassette A/B prototype</title>
<!-- THROWAWAY prototype: answers "does a flip-the-tape A/B feel good?". Final version: three.js or Blender. -->
<style>
  :root { --bg:#d9d4c7; --body:#2b2d2c; --body2:#353837; --plate:#bfc2bd; --ink:#1d1f1e; --accent:#e0702a; --muted:#6d6f69; --paper:#ece4cf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1d1c; --plate:#8c8f8a; --muted:#9a9c95; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: ui-monospace, Menlo, monospace; display:grid; place-items:center; min-height:100dvh; padding:1rem; }
  @media (prefers-color-scheme: dark) { body { color:#ddd; } }
  main { inline-size:min(720px,100%); }
  h1 { font:600 1rem/1 ui-monospace,Menlo,monospace; letter-spacing:.12em; text-transform:uppercase; margin:0 0 .75rem; }
  .deck { background:var(--body); border-radius:14px; padding:clamp(.8rem,3vw,1.4rem); box-shadow: 0 1px 0 #4a4d4b inset, 0 10px 24px rgb(0 0 0 / .35); color:#cfd2cc; }
  .top { display:grid; grid-template-columns: 1fr auto; gap:1rem; align-items:stretch; }
  .well { background:#161817; border-radius:10px; padding:.7rem; box-shadow: inset 0 2px 6px #000; perspective: 900px; overflow:hidden; }
  .cassette { inline-size:100%; display:block; transform-origin:50% 50%; }
  .cassette-face { transform-origin:50% 50%; }
  .meters { display:grid; gap:.5rem; align-content:center; inline-size:clamp(110px,22vw,160px); }
  .vu { background:var(--paper); border-radius:6px; padding:.2rem; box-shadow: inset 0 0 0 2px #0006; }
  .vu svg { display:block; inline-size:100%; }
  .counter { display:flex; justify-content:space-between; align-items:center; margin:.8rem 0 .3rem; font-size:.8rem; }
  .digits { background:#0c0e0d; color:#ff9a5a; padding:.15rem .5rem; border-radius:4px; font-size:1.1rem; letter-spacing:.1em; box-shadow: inset 0 1px 4px #000; }
  .side-lamps { display:flex; gap:.9rem; font-size:.75rem; }
  .lamp::before { content:""; display:inline-block; inline-size:.55rem; block-size:.55rem; border-radius:50%; background:#444; margin-inline-end:.35rem; vertical-align:baseline; }
  .lamp[data-on="true"]::before { background:var(--accent); }
  input[type=range] { inline-size:100%; accent-color:var(--accent); margin:.2rem 0 .8rem; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; }
  .key { min-block-size:54px; border:0; border-radius:6px 6px 3px 3px; background:var(--plate); color:#1b1c1b; font:600 .78rem ui-monospace,Menlo,monospace; letter-spacing:.08em; cursor:pointer;
         box-shadow: 0 5px 0 #6c6f6a, 0 6px 6px #0006; transform: translateY(0); transition: transform .08s, box-shadow .08s; }
  .key:active, .key[aria-pressed="true"] { transform: translateY(4px); box-shadow: 0 1px 0 #6c6f6a, 0 1px 2px #0006; }
  .key[aria-pressed="true"] { background:#aeb1ab; }
  .key:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .key span { display:block; font-size:1.1rem; margin-block-end:.1rem; }
  .jcard { margin-block-start:1.2rem; background:var(--paper); color:#2a2820; padding:.9rem 1rem; border-radius:4px; box-shadow: 0 2px 6px #0004; }
  .jcard table { inline-size:100%; border-collapse:collapse; font-size:.85rem; }
  .jcard th, .jcard td { text-align:start; padding:.4rem .5rem; border-block-end:1px solid #2a28202e; }
  .jcard thead th { font-size:.75rem; color:#6b6757; }
  .jcard [data-side] { color:#8a866f; transition:color .2s; }
  .jcard[data-side="A"] [data-side="A"], .jcard[data-side="B"] [data-side="B"] { color:#2a2820; font-weight:700; }
  .jcard thead [data-side]{ box-shadow: inset 0 -2px 0 transparent; }
  .jcard[data-side="A"] thead [data-side="A"], .jcard[data-side="B"] thead [data-side="B"] { box-shadow: inset 0 -2px 0 var(--accent); }
  .note { font-size:.75rem; color:var(--muted); margin-block-start:.8rem; }
  @media (prefers-reduced-motion: reduce) { .key { transition:none; } }
</style>
</head>
<body>
<main>
  <h1>Memo &rarr; Master</h1>
  <div class="deck">
    <div class="top">
      <div class="well"><svg id="cassette" class="cassette" viewBox="0 0 320 200" role="img" aria-label="Cassette tape"></svg></div>
      <div class="meters" aria-hidden="true">
        <div class="vu"><svg viewBox="0 0 120 70"><rect width="120" height="70" fill="#ece4cf"/>
          <path d="M14 56 A50 50 0 0 1 106 56" fill="none" stroke="#2a2820" stroke-width="1"/>
          <path d="M82 20 A50 50 0 0 1 106 56" fill="none" stroke="#c4411f" stroke-width="3"/>
          <text x="60" y="64" font-size="8" text-anchor="middle" fill="#2a2820" font-family="monospace">L</text>
          <line id="needleL" x1="60" y1="62" x2="60" y2="18" stroke="#1a1a18" stroke-width="1.5" style="transform-origin:60px 62px; transform:rotate(-40deg)"/></svg></div>
        <div class="vu"><svg viewBox="0 0 120 70"><rect width="120" height="70" fill="#ece4cf"/>
          <path d="M14 56 A50 50 0 0 1 106 56" fill="none" stroke="#2a2820" stroke-width="1"/>
          <path d="M82 20 A50 50 0 0 1 106 56" fill="none" stroke="#c4411f" stroke-width="3"/>
          <text x="60" y="64" font-size="8" text-anchor="middle" fill="#2a2820" font-family="monospace">R</text>
          <line id="needleR" x1="60" y1="62" x2="60" y2="18" stroke="#1a1a18" stroke-width="1.5" style="transform-origin:60px 62px; transform:rotate(-40deg)"/></svg></div>
      </div>
    </div>
    <div class="counter">
      <div class="side-lamps"><span class="lamp" id="lampA" data-on="true">A · MEMO</span><span class="lamp" id="lampB" data-on="false">B · MASTER</span></div>
      <div><span class="digits" id="time">0:00</span> <span class="digits" id="dur">0:00</span></div>
    </div>
    <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Seek">
    <div class="keys">
      <button class="key" id="kPlay" aria-pressed="false"><span>&#9654;&#xFE0E;</span>PLAY</button>
      <button class="key" id="kPause"><span>&#10074;&#10074;</span>PAUSE</button>
      <button class="key" id="kStop"><span>&#9632;</span>STOP</button>
      <button class="key" id="kFlip"><span>&#8645;</span>FLIP TAPE</button>
    </div>
  </div>
  <div class="jcard" id="jcard" data-side="A">
    <table>
      <thead><tr><td></td><th data-side="A">Side A · Voice Memo</th><th data-side="B">Side B · Finished Master</th></tr></thead>
      <tbody>
        <tr><th>Mic</th><td data-side="A">Phone mic</td><td data-side="B">Studio mics</td></tr>
        <tr><th>Room</th><td data-side="A">Bedroom, some room noise</td><td data-side="B">Live room</td></tr>
        <tr><th>Takes</th><td data-side="A">One take</td><td data-side="B">Layered takes and harmonies</td></tr>
        <tr><th>Mix</th><td data-side="A">None</td><td data-side="B">Mixed and finished</td></tr>
      </tbody>
    </table>
  </div>
  <p class="note">Prototype. Flip keeps the playhead. Space = play/pause, F = flip.</p>
</main>
<audio id="aA" preload="auto" src="../../../../media/voice-memo-rough.wav"></audio>
<audio id="aB" preload="auto" src="../../../../media/track-3-acoustic.wav"></audio>
<script>
const $ = id => document.getElementById(id);
const clips = { A: $('aA'), B: $('aB') };
let side = 'A', active = clips.A, flipping = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- cassette drawing (side-dependent label, reels, tape pack) ----
const svg = $('cassette');
function spokes(cx, cy) {
  let s = ''; for (let i = 0; i < 6; i++) s += `<rect x="${cx-1.5}" y="${cy-13}" width="3" height="8" fill="#e8e4d8" transform="rotate(${i*60} ${cx} ${cy})"/>`;
  return s;
}
svg.innerHTML = `
<g class="cassette-face" id="face">
  <rect x="4" y="4" width="312" height="192" rx="10" fill="#c9c2ad"/>
  <rect x="4" y="4" width="312" height="192" rx="10" fill="none" stroke="#00000033" stroke-width="2"/>
  <rect x="22" y="14" width="276" height="92" rx="4" fill="#ece4cf"/>
  <rect x="22" y="14" width="276" height="22" fill="#e0702a" id="stripe"/>
  <text x="32" y="30" font-family="monospace" font-size="13" font-weight="700" fill="#fff" id="sideLetter">A</text>
  <text x="160" y="30" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle" id="sideTitle">VOICE MEMO</text>
  <line x1="32" y1="60" x2="288" y2="60" stroke="#2a28204d"/><line x1="32" y1="76" x2="288" y2="76" stroke="#2a28204d"/><line x1="32" y1="92" x2="288" y2="92" stroke="#2a28204d"/>
  <text x="34" y="57" font-family="'Bradley Hand','Segoe Print',cursive" font-size="13" fill="#2a2820" id="handNote">my song (phone, bedroom)</text>
  <rect x="80" y="112" width="160" height="62" rx="31" fill="#1a1b1a"/>
  <rect x="94" y="118" width="132" height="50" rx="25" fill="#3a3a38" opacity=".55"/>
  <circle id="packL" cx="116" cy="143" r="22" fill="#4a3a2a"/>
  <circle id="packR" cx="204" cy="143" r="12" fill="#4a3a2a"/>
  <g id="reelL" style="transform-origin:116px 143px"><circle cx="116" cy="143" r="12" fill="#f2efe4"/><circle cx="116" cy="143" r="5" fill="#1a1b1a"/>${spokes(116,143)}</g>
  <g id="reelR" style="transform-origin:204px 143px"><circle cx="204" cy="143" r="12" fill="#f2efe4"/><circle cx="204" cy="143" r="5" fill="#1a1b1a"/>${spokes(204,143)}</g>
  <path d="M60 196 L76 176 H244 L260 196" fill="#00000022"/>
  <circle cx="16" cy="16" r="3" fill="#8e8870"/><circle cx="304" cy="16" r="3" fill="#8e8870"/><circle cx="16" cy="184" r="3" fill="#8e8870"/><circle cx="304" cy="184" r="3" fill="#8e8870"/>
</g>`;
const face = $('face'), reelL = $('reelL'), reelR = $('reelR'), packL = $('packL'), packR = $('packR');

function dress() {
  const A = side === 'A';
  $('sideLetter').textContent = side;
  $('sideTitle').textContent = A ? 'VOICE MEMO' : 'FINISHED MASTER';
  $('handNote').textContent = A ? 'my song (phone, bedroom)' : 'my song (recorded at Alcove)';
  $('stripe').setAttribute('fill', A ? '#8a866f' : '#e0702a');
  $('lampA').dataset.on = A; $('lampB').dataset.on = !A;
  $('jcard').dataset.side = side;
}
dress();

// ---- transport ----
const fmt = t => isFinite(t) ? Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0') : '0:00';
function setKeys() {
  const on = !active.paused;
  $('kPlay').setAttribute('aria-pressed', on);
}
function play() { active.play().catch(()=>{}); }
function pause() { active.pause(); }
function stop() { active.pause(); active.currentTime = 0; setKeys(); draw(); }
$('kPlay').onclick = play; $('kPause').onclick = pause; $('kStop').onclick = stop;
$('seek').oninput = e => { active.currentTime = e.target.valueAsNumber; draw(); };
for (const a of Object.values(clips)) ['play','pause','ended','loadedmetadata'].forEach(ev => a.addEventListener(ev, () => { setKeys(); draw(); }));

// ---- flip ----
async function flip() {
  if (flipping) return; flipping = true;
  const was = !active.paused, t = active.currentTime;
  active.pause();
  const next = side === 'A' ? 'B' : 'A';
  if (!reduce) {
    await face.animate([{ transform:'translateY(0) scale(1) rotateY(0)' }, { transform:'translateY(-14px) scale(1.06) rotateY(90deg)' }], { duration:260, easing:'ease-in', fill:'forwards' }).finished;
  }
  side = next; active = clips[next]; dress();
  active.currentTime = Math.min(t, active.duration || t);
  if (!reduce) {
    await face.animate([{ transform:'translateY(-14px) scale(1.06) rotateY(-90deg)' }, { transform:'translateY(0) scale(1) rotateY(0)' }], { duration:300, easing:'cubic-bezier(.2,.9,.3,1.2)', fill:'forwards' }).finished;
    face.getAnimations().forEach(a => a.cancel());
  }
  flipping = false;
  if (was) play(); else { setKeys(); draw(); }
}
$('kFlip').onclick = flip;
addEventListener('keydown', e => {
  if (e.target.matches('input,button')) return;
  if (e.code === 'Space') { e.preventDefault(); active.paused ? play() : pause(); }
  if (e.key.toLowerCase() === 'f') flip();
});

// ---- meters (Web Audio when allowed, else simulated) ----
let ctx, analysers = {}, bufs = {}, lvl = [0,0];
function tapAudio() {
  if (ctx) return; try {
    ctx = new AudioContext();
    for (const k in clips) {
      const src = ctx.createMediaElementSource(clips[k]);
      const an = ctx.createAnalyser(); an.fftSize = 512;
      src.connect(an); an.connect(ctx.destination);
      analysers[k] = an; bufs[k] = new Uint8Array(an.fftSize);
    }
  } catch { ctx = null; analysers = {}; }
}
$('kPlay').addEventListener('click', () => { tapAudio(); ctx?.resume(); });
function level() {
  const an = analysers[side];
  if (an) {
    an.getByteTimeDomainData(bufs[side]);
    let s = 0; for (const v of bufs[side]) { const x = (v-128)/128; s += x*x; }
    return Math.min(1, Math.sqrt(s / bufs[side].length) * 3.2);
  }
  return Math.random() * .55 + .15; // file:// or blocked: fake it
}

// ---- animation loop ----
let angle = 0, last = performance.now();
function draw() {
  const d = active.duration || 0, t = active.currentTime, p = d ? t / d : 0;
  $('time').textContent = fmt(t); $('dur').textContent = fmt(d);
  $('seek').max = d; $('seek').value = t;
  packL.setAttribute('r', 12 + 12 * (1 - p)); packR.setAttribute('r', 12 + 12 * p);
}
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  const on = !active.paused && !flipping;
  if (on && !reduce) angle = (angle + dt * 200) % 360;
  reelL.style.transform = `rotate(${angle}deg)`; reelR.style.transform = `rotate(${angle}deg)`;
  const target = on ? level() : 0;
  for (let i = 0; i < 2; i++) {
    const tgt = on ? Math.max(0, target * (i ? .92 : 1) + (Math.random() - .5) * .05) : 0;
    lvl[i] += (tgt - lvl[i]) * (reduce ? 1 : Math.min(1, dt * 14));
    (i ? $('needleR') : $('needleL')).style.transform = `rotate(${-40 + lvl[i] * 80}deg)`;
  }
  if (on) draw();
  requestAnimationFrame(loop);
}
draw(); requestAnimationFrame(loop);
</script>
</body>
</html>
